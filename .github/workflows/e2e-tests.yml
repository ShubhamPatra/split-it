# Example GitHub Actions workflow for E2E tests
# Rename this file to e2e-tests.yml to enable

name: E2E Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.10.0
        with:
          mongodb-version: '6.0'
      
      - name: Start backend server
        run: |
          cd server
          npm ci
          npm run dev &
          sleep 10
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/split-it-test
          JWT_SECRET: test-secret-key-for-ci-testing-only-32chars
          JWT_EXPIRES_IN: 7d
          PORT: 5000
          CLIENT_URL: http://localhost:3000
          SERVER_URL: http://localhost:5000
          SMTP_HOST: smtp.test.local
          SMTP_PORT: 587
          SMTP_USER: test@test.local
          SMTP_PASS: testpassword
          SMTP_FROM: test@test.local
      
      - name: Start frontend server
        run: |
          npm start &
          sleep 30
        env:
          REACT_APP_API_URL: http://localhost:5000/api
          CI: false
      
      - name: Run E2E tests
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30
      
      - name: Upload test videos
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: playwright-videos-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
      
      - name: Comment PR with test results
        uses: daun/playwright-report-comment@v3
        if: always() && github.event_name == 'pull_request'
        with:
          report-path: playwright-report/
          report-url: https://your-domain.com/test-reports/${{ github.run_id }}
