version: '3.8'

# Production Docker Compose for AWS EC2 deployment with Amazon ElastiCache for Redis OSS
# Run from project root: docker-compose -f deploy/docker/docker-compose.production.yml --env-file deploy/env/.env.production up -d
#
# =================================
# AWS ELASTICACHE FOR REDIS OSS CONFIGURATION
# =================================
# Required environment variables in .env.production:
# - REDIS_HOST (ElastiCache endpoint, e.g., my-cluster.xxxxx.cache.amazonaws.com)
# - REDIS_PORT=6379 (default Redis port)
# - REDIS_AUTH_TOKEN (if using AUTH - format may differ from Valkey)
# - REDIS_TLS=true (recommended for production)
# - REDIS_TLS_REJECT_UNAUTHORIZED=true (verify SSL certificates)
#
# Optional for ElastiCache Redis OSS:
# - REDIS_CONNECTION_NAME=splitit-api (for identification in Redis CLIENT LIST)
# - REDIS_CONNECT_TIMEOUT=10000 (increase for Redis OSS if experiencing timeouts)
# - REDIS_COMMAND_TIMEOUT=5000 (command execution timeout)
# - REDIS_KEEP_ALIVE=30000 (keep-alive interval for long connections)
# - REDIS_CLUSTER_MODE=true (if using ElastiCache Cluster Mode Enabled)
#
# =================================
# VALKEY TO REDIS OSS MIGRATION NOTES
# =================================
# When migrating from Valkey to Redis OSS:
# 1. Update REDIS_HOST to new Redis OSS endpoint
# 2. Verify REDIS_AUTH_TOKEN format (Redis OSS uses different auth mechanism)
# 3. Test TLS connections - certificates may differ between Valkey and Redis OSS
# 4. Increase connection timeouts if experiencing issues (Redis OSS may have different latency)
# 5. Monitor logs for any Redis OSS-specific errors during initial deployment
# 6. Verify rate limiting, Bull queues, and Socket.IO work correctly
#
# Connection timeout recommendations for Redis OSS:
# - REDIS_CONNECT_TIMEOUT=10000 (10 seconds for initial TLS handshake)
# - Retry strategy: exponential backoff up to 5 seconds between retries
#
# =================================
# LOCAL TLS TESTING
# =================================
# To test TLS-enabled Redis OSS locally:
# 1. Generate self-signed certificates for local testing
# 2. Run Redis with --tls-port 6379 --tls-cert-file --tls-key-file flags
# 3. Set REDIS_TLS=true and REDIS_TLS_REJECT_UNAUTHORIZED=false (dev only)

services:
  api:
    build:
      context: ../../server
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    env_file:
      - ../env/.env.production
    volumes:
      - ../../server/uploads:/app/uploads
      - ../../server/logs:/app/logs
    networks:
      - splitit
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.production.conf:/etc/nginx/nginx.conf:ro
      - ../../build:/usr/share/nginx/html:ro
      - ../../ssl:/etc/nginx/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    networks:
      - splitit
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  splitit:
    driver: bridge
