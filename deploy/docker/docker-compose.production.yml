version: '3.8'

# Production Docker Compose for AWS EC2 deployment with Amazon ElastiCache
# Run from project root: docker-compose -f deploy/docker/docker-compose.production.yml --env-file deploy/env/.env.production up -d
#
# Required environment variables in .env.production:
# - REDIS_HOST (ElastiCache endpoint, e.g., my-cluster.xxxxx.cache.amazonaws.com)
# - REDIS_AUTH_TOKEN (if using AUTH)
# - REDIS_TLS=true (recommended for production)

services:
  api:
    build:
      context: ../../server
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      # ElastiCache settings (set in .env.production)
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_AUTH_TOKEN=${REDIS_AUTH_TOKEN:-}
      - REDIS_TLS=${REDIS_TLS:-true}
      - REDIS_CLUSTER_MODE=${REDIS_CLUSTER_MODE:-false}
    env_file:
      - ../env/.env.production
    volumes:
      - ../../server/uploads:/app/uploads
      - ../../server/logs:/app/logs
    networks:
      - splitit
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.production.conf:/etc/nginx/nginx.conf:ro
      - ../../build:/usr/share/nginx/html:ro
      - ../../ssl:/etc/nginx/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    networks:
      - splitit
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  splitit:
    driver: bridge
