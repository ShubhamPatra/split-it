version: '3.8'

# Production Docker Compose for AWS EC2 deployment
# Run from project root: docker-compose -f deploy/docker/docker-compose.production.yml --env-file deploy/env/.env.production up -d
#
# This configuration uses in-process job scheduling (node-cron) instead of Redis/BullMQ.
# No external Redis dependency is required.

services:
  api:
    build:
      context: ../../server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Upload directory - use container-managed volume for proper permissions
      - UPLOAD_DIR=/app/uploads/receipts
    env_file:
      - ../env/.env.production
    volumes:
      # Use named volume for uploads to ensure proper ownership and permissions
      - uploads:/app/uploads
      # Use named volume for logs
      - logs:/app/logs
    networks:
      - splitit
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))" ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.production.conf:/etc/nginx/nginx.conf:ro
      - ../../build:/usr/share/nginx/html:ro
      - ../../ssl:/etc/nginx/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    networks:
      - splitit
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  splitit:
    driver: bridge

volumes:
  uploads:
    driver: local
  logs:
    driver: local
