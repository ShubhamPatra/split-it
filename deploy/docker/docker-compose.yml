version: '3.8'

# Development Docker Compose
# Run from project root: docker-compose -f deploy/docker/docker-compose.yml up -d

services:
  mongodb:
    image: mongo:7
    restart: always
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

  api:
    build:
      context: ../../server
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD}@mongodb:27017/splitit?authSource=admin

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../../ssl:/etc/nginx/ssl
      - ../../build:/usr/share/nginx/html

volumes:
  mongo-data:
